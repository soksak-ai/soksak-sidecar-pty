name: windows-system-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.0"
          cache: true
      - shell: bash
        run: go test -count=1 ./... && go vet ./...
      - shell: bash
        run: |
          ./stage.sh package/dist x86_64-pc-windows-msvc
          mv package/dist/sidecar.json package/sidecar.json
          cp LICENSE package/
          test -f package/dist/soksak-sidecar-pty.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-system-artifact
          path: package
          if-no-files-found: error
          compression-level: 0
