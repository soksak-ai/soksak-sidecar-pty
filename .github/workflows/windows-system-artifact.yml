name: windows-system-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache: true
      - shell: bash
        run: go test -count=1 ./... && go vet ./...
      - shell: bash
        run: |
          ./stage.sh package/dist x86_64-pc-windows-msvc
          mv package/dist/sidecar.json package/sidecar.json
          cp LICENSE package/
          test -f package/dist/soksak-sidecar-pty.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-system-artifact
          path: package
          if-no-files-found: error
          compression-level: 0
