name: release

on:
  workflow_dispatch:
    inputs:
      spec_url:
        description: Exact immutable soksak-spec package URL from the release train
        required: true
        type: string
      spec_sha256:
        description: SHA-256 of the exact soksak-spec package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inject the exact spec validation tool
        shell: bash
        run: |
          case "${{ inputs.spec_url }}" in
            https://github.com/soksak-ai/soksak-spec/releases/download/v*/soksak-ai-plugin-spec-*.tgz) ;;
            *) echo "spec_url is not an immutable soksak-spec release asset" >&2; exit 1 ;;
          esac
          digest="${{ inputs.spec_sha256 }}"
          test "${#digest}" -eq 64
          case "$digest" in *[!a-f0-9]*) echo "spec_sha256 is invalid" >&2; exit 1 ;; esac
          mkdir -p .dependency/spec-package
          curl -fsSL "${{ inputs.spec_url }}" -o .dependency/soksak-spec.tgz
          actual="$(if command -v sha256sum >/dev/null 2>&1; then sha256sum .dependency/soksak-spec.tgz; else shasum -a 256 .dependency/soksak-spec.tgz; fi | awk '{print $1}')"
          test "$actual" = "$digest"
          tar -xzf .dependency/soksak-spec.tgz -C .dependency/spec-package --strip-components=1
          test -z "$(find .dependency/spec-package -type l -print -quit)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .dependency/spec-package/package.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - if: runner.os == 'Windows'
        shell: bash
        run: choco install make --version=4.4.1 --no-progress --yes
      - shell: bash
        run: make verify TARGET="${{ matrix.target }}"
      - id: archive
        shell: bash
        run: |
          make stage TARGET="${{ matrix.target }}" OUT=dist
          make stage TARGET="${{ matrix.target }}" OUT=dist
          version="$(node -p 'require("./sidecar.json").version')"
          archive="soksak-sidecar-pty-$version-${{ matrix.target }}.tar.gz"
          mkdir -p package/dist
          cp dist/sidecar.json LICENSE package/
          cp dist/soksak-sidecar-pty* package/dist/
          node .dependency/spec-package/release-template/sidecar/pack-target.mjs --source package --target "${{ matrix.target }}" --out "$archive"
          echo "asset=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.archive.outputs.asset }}
            ${{ steps.archive.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Inject the exact spec validation tool
        run: |
          mkdir -p .dependency/spec-package
          case "${{ inputs.spec_url }}" in
            https://github.com/soksak-ai/soksak-spec/releases/download/v*/soksak-ai-plugin-spec-*.tgz) ;;
            *) echo "spec_url is not an immutable soksak-spec release asset" >&2; exit 1 ;;
          esac
          digest="${{ inputs.spec_sha256 }}"
          test "${#digest}" -eq 64
          case "$digest" in *[!a-f0-9]*) echo "spec_sha256 is invalid" >&2; exit 1 ;; esac
          curl -fsSL "${{ inputs.spec_url }}" -o .dependency/soksak-spec.tgz
          test "$(sha256sum .dependency/soksak-spec.tgz | awk '{print $1}')" = "$digest"
          tar -xzf .dependency/soksak-spec.tgz -C .dependency/spec-package --strip-components=1
          test -z "$(find .dependency/spec-package -type l -print -quit)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .dependency/spec-package/package.json
      - run: node .dependency/spec-package/release-template/sidecar/build-release.mjs --commit "${{ github.sha }}" --tag "v$(node -p 'require("./sidecar.json").version')" --artifacts dist --out dist-release
      - run: node .dependency/spec-package/release-template/sidecar/validate-with-spec.mjs --spec-package .dependency/spec-package --release-dir dist-release
      - run: |
          mkdir publish-assets
          find dist -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} publish-assets/ \;
          cp dist-release/*.json publish-assets/
      - id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/immutable-releases --jq '.enabled and .enforced_by_owner')" = true || { echo "owner-enforced immutable releases must be enabled before tagging" >&2; exit 1; }
          node .dependency/spec-package/release-template/publish-canonical-release.mjs --repository "${{ github.repository }}" --commit "${{ github.sha }}" --artifacts "$GITHUB_WORKSPACE/publish-assets" --manifest "$GITHUB_WORKSPACE/publish-assets/release.json"
