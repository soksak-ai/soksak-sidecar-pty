name: conpty-compare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: diagnostics/conptycompare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache-dependency-path: diagnostics/conptycompare/go.sum
      - run: go test -count=1 -v ./...
