name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, os: windows }
          - { runner: ubuntu-24.04, os: linux }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache: true
      - name: Verify native PTY runtime
        run: go test -count=1 ./...
      - name: Vet native PTY source
        run: go vet ./...
