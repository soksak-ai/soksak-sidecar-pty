name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - if: runner.os == 'Windows'
        shell: bash
        run: choco install make --version=4.4.1 --no-progress --yes
      - name: Verify native PTY runtime
        shell: bash
        run: make verify TARGET="${{ matrix.target }}"
